<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Hamza's contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12203A;
    --ink-soft:#1B2E4E;
    --paper:#FBF9F4;
    --brass:#C79049;
    --mist:#9FB0C6;
    --line:#2A3B5C;
    --slate:#5B6B82;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:var(--ink);
    background-image:radial-gradient(circle at 20% 0%, var(--ink-soft), var(--ink) 55%);
    font-family:'Inter',sans-serif;
    padding:48px 18px 60px;
  }
  .card{
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .photo{
    width:150px;height:150px;
    border-radius:50%;
    border:5px solid var(--brass);
    object-fit:cover;
    margin-bottom:22px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    color:var(--paper);
    margin:0 0 6px;
  }
  .title{
    color:var(--brass);
    font-size:16.5px;
    margin:0 0 4px;
  }
  .company{
    color:var(--mist);
    font-size:14px;
    margin:0 0 26px;
  }
  .save-btn{
    display:block;
    width:100%;
    padding:16px;
    border-radius:12px;
    background:var(--brass);
    color:var(--ink);
    font-weight:600;
    font-size:16px;
    text-decoration:none;
    margin-bottom:14px;
  }
  .save-btn:active{opacity:.85;}
  .hint{
    color:var(--mist);
    font-size:12.5px;
    line-height:1.5;
    margin-bottom:32px;
  }
  .details{
    background:var(--paper);
    border-radius:16px;
    padding:20px 22px;
    text-align:left;
  }
  .row{margin-bottom:14px;}
  .row:last-child{margin-bottom:0;}
  .row .label{
    font-size:11px;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .row .value{
    font-size:15px;
    color:var(--ink);
    font-weight:600;
  }
  .row .value a{color:var(--ink);text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <img class="photo" src="hamza-photo.jpg" alt="Hamza Danawala">
  <h1>Hamza Danawala</h1>
  <p class="title">Odoo Consultant</p>
  <p class="company">Serpent Consulting Services Pvt. Ltd.</p>

  <a class="save-btn" href="hamza-danawala.vcf">Save my contact</a>
  <p class="hint">Opens your phone's native contact screen &mdash; name, number, email, website and photo all included.</p>

  <div class="details">
    <div class="row">
      <div class="label">Phone</div>
      <div class="value"><a href="tel:+917486040229">+91 74860 40229</a></div>
    </div>
    <div class="row">
      <div class="label">Email</div>
      <div class="value"><a href="mailto:hamza@serpentcs.com">hamza@serpentcs.com</a></div>
    </div>
    <div class="row">
      <div class="label">Website</div>
      <div class="value"><a href="https://www.serpentcs.com/">www.serpentcs.com</a></div>
    </div>
  </div>
</div>
</body>
</html>
